version: '3.8'

services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      # Database stored in persistent volume
      - DATABASE_URL=file:/app/data/prod.db
      # Set these in a .env file alongside docker-compose.yml (see .env.example)
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost:3000}
    volumes:
      # Persist the SQLite database across container restarts
      - db-data:/app/data
    restart: unless-stopped

volumes:
  db-data:
